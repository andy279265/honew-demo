name: One-time Vimeo outro inspection
on:
  push:
    branches:
      - vimeo-tail-audit-20261026
    paths:
      - .github/workflows/vimeo-outro-inspection.yml
      - scripts/vimeo_tail_audit.py
permissions:
  contents: write
jobs:
  inspect:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check yt-dlp pillow
      - name: Inspect public Vimeo media near end
        run: python scripts/vimeo_tail_audit.py
      - name: Commit inspection report to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-outros
          git commit -m '[skip ci] Add Vimeo tail contact sheets and inspection metadata' || exit 0
          git push origin HEAD:vimeo-tail-audit-20261026
